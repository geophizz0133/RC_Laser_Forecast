<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>East Greenwich RC Laser Dashboard</title>

<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
    --green:#22c55e;
    --yellow:#f59e0b;
    --red:#ef4444;
    --blue:#38bdf8;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

h1{
    margin-bottom:0;
}

.subtitle{
    opacity:.8;
    margin-bottom:20px;
}

.grid{
    display:grid;
    gap:12px;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
}

.card{
    background:var(--card);
    padding:15px;
    border-radius:12px;
}

.label{
    font-size:.9rem;
    opacity:.75;
}

.value{
    font-size:2rem;
    font-weight:bold;
    margin-top:5px;
}

.go{color:var(--green);}
.marginal{color:var(--yellow);}
.nogo{color:var(--red);}

.section{
    margin-top:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:8px;
    text-align:left;
}

tr:nth-child(even){
    background:rgba(255,255,255,.05);
}

.small{
    font-size:.85rem;
    opacity:.8;
}

.rec{
    line-height:1.6;
}
</style>
</head>

<body>

<h1>East Greenwich RC Laser Dashboard</h1>

<div class="subtitle">
Narragansett Bay · Sailing Window 11:30 AM–3:00 PM
</div>

<div id="updated" class="small">
Loading...
</div>

<div class="grid">

    <div class="card">
        <div class="label">Wind</div>
        <div id="wind" class="value">--</div>
        <div id="direction"></div>
    </div>

    <div class="card">
        <div class="label">Estimated Gusts</div>
        <div id="gusts" class="value">--</div>
    </div>

    <div class="card">
        <div class="label">Precipitation</div>
        <div id="rain" class="value">--</div>
    </div>

    <div class="card">
        <div class="label">Wave Estimate</div>
        <div id="waves" class="value">--</div>
    </div>

    <div class="card">
        <div class="label">Recommended Sail</div>
        <div id="sail" class="value">--</div>
    </div
